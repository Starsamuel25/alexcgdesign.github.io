    <style>
:root {
    --bg: #f4f6f8;
    --surface: #ffffff;
    --text: #0f172a;
    --muted: #64748b;
    --border: #e2e8f0;
    --primary: #0f766e;
    --primary-dark: #0d5e58;
    --accent: #2563eb;
    --ok: #16a34a;
    --warn: #f59e0b;
    --danger: #dc2626;
    --info: #0ea5e9;
    --shadow: 0 1px 2px rgba(15, 23, 42, .06), 0 4px 12px rgba(15, 23, 42, .04);
    --radius: 12px;
}

* { box-sizing: border-box; }

html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 15px;
    line-height: 1.4;
}

.topbar {
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
    color: #fff;
    padding: 14px 18px;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 50;
    box-shadow: var(--shadow);
}

.topbar h1 {
    margin: 0;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.01em;
}

.topbar__tagline {
    display: block;
    font-size: 12px;
    opacity: 0.85;
    margin-top: 2px;
}

.topbar__stats {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

.stat {
    background: rgba(255, 255, 255, 0.18);
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
}
.stat--ok    { background: rgba(22, 163, 74, .85); }
.stat--warn  { background: rgba(245, 158, 11, .85); }

.toolbar {
    background: var(--surface);
    padding: 12px 18px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 62px;
    z-index: 40;
}

.toolbar__search,
.toolbar__select {
    height: 40px;
    padding: 0 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: #fff;
    font: inherit;
    color: var(--text);
    outline: none;
    transition: border-color .15s, box-shadow .15s;
}

.toolbar__search:focus,
.toolbar__select:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(15, 118, 110, .15);
}

.toolbar__search {
    flex: 1 1 320px;
    min-width: 220px;
}

.toolbar__btn {
    height: 40px;
    padding: 0 14px;
    border-radius: 10px;
    border: 1px solid var(--primary);
    background: var(--primary);
    color: #fff;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s;
}
.toolbar__btn:hover { background: var(--primary-dark); }
.toolbar__btn--danger {
    background: #fff;
    color: var(--danger);
    border-color: var(--danger);
}
.toolbar__btn--danger:hover {
    background: var(--danger);
    color: #fff;
}

.grid {
    padding: 18px;
    display: grid;
    gap: 14px;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    max-width: 1400px;
    margin: 0 auto;
}

.card {
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    border-top: 4px solid transparent;
    transition: transform .12s, box-shadow .12s;
}
.card:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(15,23,42,.08); }

.card[data-estado="contactado"] { border-top-color: var(--info); }
.card[data-estado="agendado"]   { border-top-color: var(--ok); }
.card[data-estado="no_responde"]{ border-top-color: var(--warn); }
.card[data-estado="descartado"] { border-top-color: var(--danger); opacity: 0.7; }

.card__head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
}

.card__name {
    font-size: 16px;
    font-weight: 700;
    margin: 0;
    line-height: 1.25;
    color: var(--text);
}

.card__estado {
    font-size: 11px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 999px;
    background: #e2e8f0;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    white-space: nowrap;
    flex-shrink: 0;
}
.card[data-estado="contactado"]  .card__estado { background: rgba(14,165,233,.15); color: #0369a1; }
.card[data-estado="agendado"]    .card__estado { background: rgba(22,163,74,.15);  color: #166534; }
.card[data-estado="no_responde"] .card__estado { background: rgba(245,158,11,.18); color: #92400e; }
.card[data-estado="descartado"]  .card__estado { background: rgba(220,38,38,.15);  color: #991b1b; }

.card__direccion {
    color: var(--muted);
    margin: 0;
    font-size: 13px;
}

.card__meta {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin: 0;
    font-size: 12px;
}

.card__meta span {
    background: #f1f5f9;
    color: #475569;
    padding: 3px 8px;
    border-radius: 6px;
    font-weight: 500;
}

.card__phones {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-top: 4px;
}

.phone-link {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    background: var(--primary);
    color: #fff;
    text-decoration: none;
    border-radius: 10px;
    font-weight: 600;
    font-size: 15px;
    transition: background .15s, transform .1s;
}
.phone-link:hover  { background: var(--primary-dark); }
.phone-link:active { transform: scale(.98); }
.phone-link::before {
    content: "📞";
    font-size: 16px;
}
.phone-link--alt {
    background: #fff;
    color: var(--primary);
    border: 1px solid var(--primary);
}
.phone-link--alt:hover {
    background: var(--primary);
    color: #fff;
}
.phone-link--missing {
    background: #fef3c7;
    color: #92400e;
    cursor: not-allowed;
    pointer-events: none;
    border: 1px dashed #f59e0b;
}
.phone-link--missing::before { content: "⚠️"; }

.card__actions {
    display: flex;
    gap: 8px;
    margin-top: 4px;
}

.card__estadoSelect {
    flex: 1;
    height: 38px;
    padding: 0 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #fff;
    font: inherit;
    cursor: pointer;
}

.card__notasBtn {
    height: 38px;
    padding: 0 14px;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 8px;
    font: inherit;
    font-weight: 600;
    color: var(--text);
    cursor: pointer;
}
.card__notasBtn:hover { background: #f1f5f9; }
.card__notasBtn[aria-pressed="true"] {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
}

.card__notas {
    width: 100%;
    min-height: 70px;
    padding: 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font: inherit;
    resize: vertical;
    margin-top: 4px;
}
.card__notas:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(15, 118, 110, .15);
}

.card__fuente {
    color: var(--muted);
    font-size: 11px;
    margin-top: 4px;
}

.bottombar {
    text-align: center;
    color: var(--muted);
    padding: 20px 18px 30px;
    font-size: 12px;
}

.empty {
    grid-column: 1 / -1;
    text-align: center;
    color: var(--muted);
    padding: 60px 20px;
    font-size: 15px;
}

@media (max-width: 600px) {
    .topbar { padding: 12px 14px; }
    .topbar h1 { font-size: 16px; }
    .toolbar { padding: 10px 14px; top: 70px; }
    .grid { padding: 14px; gap: 12px; }
    .card { padding: 14px; }
    .card__name { font-size: 15px; }
}

</style>
</head>

            <small class="card__fuente"></small>
        </article>
    </template>

<script>
// CRM Dentistas RD - logica cliente
// El estado por contacto (estado + notas) se guarda en localStorage bajo "crm_dentistas_state_v1".

const STORAGE_KEY = "crm_dentistas_state_v1";
const ESTADOS = ["pendiente", "contactado", "agendado", "no_responde", "descartado"];
const ESTADO_LABEL = {
    pendiente:   "Pendiente",
    contactado:  "Contactado",
    agendado:    "Agendado",
    no_responde: "No responde",
    descartado:  "Descartado",
};

const state = {
    dentistas: [],
    progreso: {},      // { [id]: { estado, notas, updated } }
    filtros: { texto: "", provincia: "", estado: "" },
};

const els = {
    grid: document.getElementById("grid"),
    search: document.getElementById("search"),
    filterProvincia: document.getElementById("filterProvincia"),
    filterEstado: document.getElementById("filterEstado"),
    btnExport: document.getElementById("btnExport"),
    btnReset: document.getElementById("btnReset"),
    statTotal: document.getElementById("statTotal"),
    statHechos: document.getElementById("statHechos"),
    statPendientes: document.getElementById("statPendientes"),
    template: document.getElementById("cardTemplate"),
};

// ---------------------------------------------------------------------------
// Persistencia
// ---------------------------------------------------------------------------
function loadProgress() {
    try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : {};
    } catch (err) {
        console.warn("No se pudo leer el progreso:", err);
        return {};
    }
}

function saveProgress() {
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state.progreso));
    } catch (err) {
        console.warn("No se pudo guardar el progreso:", err);
    }
}

function getProgreso(id) {
    if (!state.progreso[id]) {
        state.progreso[id] = { estado: "pendiente", notas: "", updated: null };
    }
    return state.progreso[id];
}

// ---------------------------------------------------------------------------
// Carga del dataset
// ---------------------------------------------------------------------------
async function loadDataset() {
    state.dentistas = window.__DENTISTS_DATA__.dentistas || [];
}

// ---------------------------------------------------------------------------
// Filtros
// ---------------------------------------------------------------------------
function normalize(text) {
    return (text || "")
        .toString()
        .toLowerCase()
        .normalize("NFD")
        .replace(/[̀-ͯ]/g, "");
}

function applyFilters() {
    const q = normalize(state.filtros.texto.trim());
    const provincia = state.filtros.provincia;
    const estadoF = state.filtros.estado;
    return state.dentistas.filter((d) => {
        if (provincia && d.provincia !== provincia) return false;
        if (estadoF) {
            const est = getProgreso(d.id).estado;
            if (est !== estadoF) return false;
        }
        if (!q) return true;
        const haystack = normalize(
            [d.nombre, d.telefono, d.telefono_alt, d.direccion, d.ciudad, d.provincia, d.especialidad].join(" ")
        );
        return haystack.includes(q);
    });
}

// ---------------------------------------------------------------------------
// Render
// ---------------------------------------------------------------------------
function renderProvincias() {
    const provincias = Array.from(
        new Set(state.dentistas.map((d) => d.provincia).filter(Boolean))
    ).sort();
    els.filterProvincia.innerHTML =
        '<option value="">Todas las provincias</option>' +
        provincias.map((p) => `<option value="${p}">${p}</option>`).join("");
}

function buildPhoneLink(phone, isAlt) {
    if (!phone || phone === "verificar") {
        return `<span class="phone-link phone-link--missing">Verificar telefono</span>`;
    }
    const clean = phone.replace(/[^\d+]/g, "");
    const tel = clean.startsWith("+") ? clean : `+1${clean.replace(/^1/, "")}`;
    return `<a class="phone-link${isAlt ? " phone-link--alt" : ""}" href="tel:${tel}">${phone}</a>`;
}

function renderCard(dentista) {
    const node = els.template.content.firstElementChild.cloneNode(true);
    const progreso = getProgreso(dentista.id);

    node.dataset.id = dentista.id;
    node.dataset.estado = progreso.estado;

    node.querySelector(".card__name").textContent = dentista.nombre;
    node.querySelector(".card__direccion").textContent = dentista.direccion || "(sin direccion)";
    node.querySelector(".card__provincia").textContent =
        [dentista.ciudad, dentista.provincia].filter(Boolean).join(" · ") || "Sin provincia";
    node.querySelector(".card__especialidad").textContent = dentista.especialidad || "";
    node.querySelector(".card__estado").textContent = ESTADO_LABEL[progreso.estado];
    node.querySelector(".card__fuente").textContent = dentista.fuente ? `Fuente: ${dentista.fuente}` : "";

    const phones = node.querySelector(".card__phones");
    phones.insertAdjacentHTML("beforeend", buildPhoneLink(dentista.telefono, false));
    if (dentista.telefono_alt) {
        phones.insertAdjacentHTML("beforeend", buildPhoneLink(dentista.telefono_alt, true));
    }

    const estadoSelect = node.querySelector(".card__estadoSelect");
    estadoSelect.value = progreso.estado;
    estadoSelect.addEventListener("change", (e) => {
        const nuevo = e.target.value;
        const p = getProgreso(dentista.id);
        p.estado = nuevo;
        p.updated = new Date().toISOString();
        saveProgress();
        node.dataset.estado = nuevo;
        node.querySelector(".card__estado").textContent = ESTADO_LABEL[nuevo];
        updateStats();
        // Si el filtro de estado esta activo y la nueva categoria no coincide, lo escondemos.
        if (state.filtros.estado && state.filtros.estado !== nuevo) {
            node.remove();
        }
    });

    const notasArea = node.querySelector(".card__notas");
    notasArea.value = progreso.notas || "";
    const notasBtn = node.querySelector(".card__notasBtn");
    if (progreso.notas) {
        notasBtn.setAttribute("aria-pressed", "true");
        notasBtn.textContent = "Notas ●";
    }
    notasBtn.addEventListener("click", () => {
        const isOpen = !notasArea.hidden;
        notasArea.hidden = isOpen;
        notasBtn.setAttribute("aria-pressed", isOpen ? "false" : "true");
        if (!isOpen) notasArea.focus();
    });

    let saveTimeout;
    notasArea.addEventListener("input", (e) => {
        clearTimeout(saveTimeout);
        saveTimeout = setTimeout(() => {
            const p = getProgreso(dentista.id);
            p.notas = e.target.value;
            p.updated = new Date().toISOString();
            saveProgress();
            notasBtn.textContent = p.notas ? "Notas ●" : "Notas";
        }, 300);
    });

    return node;
}

function render() {
    const filtered = applyFilters();
    els.grid.innerHTML = "";
    if (!filtered.length) {
        els.grid.innerHTML = '<div class="empty">No hay contactos que coincidan con los filtros.</div>';
    } else {
        const frag = document.createDocumentFragment();
        filtered.forEach((d) => frag.appendChild(renderCard(d)));
        els.grid.appendChild(frag);
    }
    updateStats();
}

function updateStats() {
    const total = state.dentistas.length;
    let hechos = 0, pendientes = 0;
    state.dentistas.forEach((d) => {
        const est = getProgreso(d.id).estado;
        if (est === "agendado" || est === "contactado") hechos++;
        if (est === "pendiente") pendientes++;
    });
    els.statTotal.textContent = `${total} contactos`;
    els.statHechos.textContent = `${hechos} hechos`;
    els.statPendientes.textContent = `${pendientes} pendientes`;
}

// ---------------------------------------------------------------------------
// Export CSV
// ---------------------------------------------------------------------------
function exportCSV() {
    const headers = ["id","nombre","telefono","telefono_alt","direccion","ciudad","provincia","especialidad","estado","notas","fuente"];
    const rows = state.dentistas.map((d) => {
        const p = getProgreso(d.id);
        return headers.map((h) => {
            const val = h === "estado" ? ESTADO_LABEL[p.estado]
                     : h === "notas"  ? (p.notas || "")
                     : (d[h] || "");
            return `"${String(val).replace(/"/g, '""')}"`;
        }).join(",");
    });
    const csv = [headers.join(","), ...rows].join("\n");
    const blob = new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `crm-dentistas-${new Date().toISOString().slice(0,10)}.csv`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
}

// ---------------------------------------------------------------------------
// Eventos
// ---------------------------------------------------------------------------
function wireEvents() {
    let searchTimeout;
    els.search.addEventListener("input", (e) => {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(() => {
            state.filtros.texto = e.target.value;
            render();
        }, 150);
    });
    els.filterProvincia.addEventListener("change", (e) => {
        state.filtros.provincia = e.target.value;
        render();
    });
    els.filterEstado.addEventListener("change", (e) => {
        state.filtros.estado = e.target.value;
        render();
    });
    els.btnExport.addEventListener("click", exportCSV);
    els.btnReset.addEventListener("click", () => {
        if (confirm("Borrar todos los estados y notas guardados?")) {
            state.progreso = {};
            localStorage.removeItem(STORAGE_KEY);
            render();
        }
    });
}

// ---------------------------------------------------------------------------
// Init
// ---------------------------------------------------------------------------
(async function init() {
    try {
        state.progreso = loadProgress();
        await loadDataset();
        renderProvincias();
        wireEvents();
        render();
    } catch (err) {
        console.error(err);
        els.grid.innerHTML = `<div class="empty">Error cargando datos: ${err.message}</div>`;
    }
})();

</script>
</body>
</html>
