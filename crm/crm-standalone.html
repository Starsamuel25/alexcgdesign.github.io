<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f766e">
    <title>CRM Dentistas RD &middot; Pipeline de ventas</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E🦷%3C/text%3E%3C/svg%3E">
    <style>
:root {
    --bg: #f4f6f8;
    --surface: #ffffff;
    --text: #0f172a;
    --muted: #64748b;
    --border: #e2e8f0;
    --primary: #0f766e;
    --primary-dark: #0d5e58;
    --accent: #2563eb;
    --ok: #16a34a;
    --warn: #f59e0b;
    --danger: #dc2626;
    --info: #0ea5e9;
    --hot: #ea580c;
    --wa: #25d366;
    --wa-dark: #1ebe57;
    --shadow: 0 1px 2px rgba(15, 23, 42, .06), 0 4px 12px rgba(15, 23, 42, .04);
    --radius: 12px;
}

* { box-sizing: border-box; }

html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 15px;
    line-height: 1.4;
}

.topbar {
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
    color: #fff;
    padding: 14px 18px;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 50;
    box-shadow: var(--shadow);
}
.topbar h1 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
.topbar__tagline { display: block; font-size: 12px; opacity: 0.85; margin-top: 2px; }

.topbar__stats { display: flex; gap: 8px; flex-wrap: wrap; }
.stat {
    background: rgba(255, 255, 255, 0.18);
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
}
.stat--ok   { background: rgba(22, 163, 74, .85); }
.stat--info { background: rgba(14, 165, 233, .85); }
.stat--hot  { background: rgba(234, 88, 12, .9); }

.toolbar {
    background: var(--surface);
    padding: 12px 18px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 62px;
    z-index: 40;
}

.toolbar__search,
.toolbar__select {
    height: 40px;
    padding: 0 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: #fff;
    font: inherit;
    color: var(--text);
    outline: none;
    transition: border-color .15s, box-shadow .15s;
}
.toolbar__search:focus,
.toolbar__select:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(15, 118, 110, .15);
}
.toolbar__search { flex: 1 1 280px; min-width: 200px; }

.toolbar__btn {
    height: 40px;
    padding: 0 14px;
    border-radius: 10px;
    border: 1px solid var(--primary);
    background: var(--primary);
    color: #fff;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s;
}
.toolbar__btn:hover { background: var(--primary-dark); }
.toolbar__btn--danger {
    background: #fff;
    color: var(--danger);
    border-color: var(--danger);
}
.toolbar__btn--danger:hover { background: var(--danger); color: #fff; }

.grid {
    padding: 18px;
    display: grid;
    gap: 14px;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    max-width: 1400px;
    margin: 0 auto;
}

.card {
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    border-top: 4px solid transparent;
    transition: transform .12s, box-shadow .12s;
}
.card:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(15,23,42,.08); }

.card[data-score="alto"]  { border-top-color: var(--hot); }
.card[data-score="medio"] { border-top-color: var(--info); }
.card[data-score="bajo"]  { border-top-color: var(--muted); opacity: 0.92; }

.card[data-estado="contactado"]        { background: linear-gradient(180deg, rgba(14,165,233,.04), #fff 30%); }
.card[data-estado="cita_agendada"]     { background: linear-gradient(180deg, rgba(22,163,74,.06), #fff 30%); }
.card[data-estado="propuesta_enviada"] { background: linear-gradient(180deg, rgba(37,99,235,.06), #fff 30%); }
.card[data-estado="cerrado_ganado"]    { background: linear-gradient(180deg, rgba(22,163,74,.12), #fff 50%); }
.card[data-estado="cerrado_perdido"]   { opacity: 0.55; }

.card__head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.card__head-left { display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1; }
.card__name { font-size: 16px; font-weight: 700; margin: 0; line-height: 1.25; color: var(--text); }
.card__score {
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
    align-self: flex-start;
}
.card[data-score="alto"] .card__score { color: var(--hot); }

.card__estado {
    font-size: 11px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 999px;
    background: #e2e8f0;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    white-space: nowrap;
    flex-shrink: 0;
}
.card[data-estado="auditado"]          .card__estado { background: rgba(245,158,11,.18); color: #92400e; }
.card[data-estado="contactado"]        .card__estado { background: rgba(14,165,233,.15); color: #0369a1; }
.card[data-estado="cita_agendada"]     .card__estado { background: rgba(22,163,74,.15);  color: #166534; }
.card[data-estado="propuesta_enviada"] .card__estado { background: rgba(37,99,235,.18);  color: #1e40af; }
.card[data-estado="cerrado_ganado"]    .card__estado { background: var(--ok); color: #fff; }
.card[data-estado="cerrado_perdido"]   .card__estado { background: rgba(220,38,38,.15);  color: #991b1b; }

.card__direccion { color: var(--muted); margin: 0; font-size: 13px; }
.card__meta { display: flex; gap: 6px; flex-wrap: wrap; margin: 0; font-size: 12px; }
.card__meta span { background: #f1f5f9; color: #475569; padding: 3px 8px; border-radius: 6px; font-weight: 500; }

.card__contacto { display: flex; flex-direction: column; gap: 8px; margin-top: 2px; }

.phone-row {
    display: flex;
    gap: 6px;
    align-items: stretch;
}
.phone-row--missing {
    background: #fef3c7;
    border: 1px dashed #f59e0b;
    border-radius: 10px;
    padding: 8px 10px;
    gap: 6px;
    align-items: center;
    flex-wrap: wrap;
}
.phone-row__label { font-weight: 600; color: #92400e; font-size: 12px; }

.phone-link {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    background: var(--primary);
    color: #fff;
    text-decoration: none;
    border-radius: 10px;
    font-weight: 600;
    font-size: 14px;
    transition: background .15s, transform .1s;
}
.phone-link:hover { background: var(--primary-dark); }
.phone-link:active { transform: scale(.98); }
.phone-link--alt { background: #fff; color: var(--primary); border: 1px solid var(--primary); }
.phone-link--alt:hover { background: var(--primary); color: #fff; }

.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 8px 12px;
    border-radius: 8px;
    text-decoration: none;
    font-weight: 600;
    font-size: 13px;
    border: 1px solid var(--border);
    background: #fff;
    color: var(--text);
    transition: background .15s, transform .1s;
    white-space: nowrap;
}
.btn:hover { background: #f1f5f9; }
.btn:active { transform: scale(.97); }

.btn--mini { padding: 6px 10px; font-size: 12px; }

.btn--wa {
    background: var(--wa);
    border-color: var(--wa);
    color: #fff;
    min-width: 46px;
}
.btn--wa:hover { background: var(--wa-dark); }

.btn--web {
    background: #eef2ff;
    border-color: #c7d2fe;
    color: #3730a3;
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
}
.btn--web:hover { background: #e0e7ff; }

.btn--audit {
    background: #fef9c3;
    border-color: #fde68a;
    color: #854d0e;
}
.btn--audit:hover { background: #fef3c7; }

.web-row {
    display: flex;
    gap: 6px;
    align-items: center;
    flex-wrap: wrap;
}
.web-row--missing {
    background: #ecfccb;
    border: 1px solid #bef264;
    border-radius: 10px;
    padding: 8px 10px;
    justify-content: space-between;
}
.no-web {
    color: #4d7c0f;
    font-weight: 600;
    font-size: 13px;
}
.web-tag {
    font-size: 11px;
    background: #f1f5f9;
    color: #475569;
    padding: 3px 8px;
    border-radius: 6px;
    font-weight: 600;
}
.web-tag--opp {
    background: #fee2e2;
    color: #991b1b;
}

.card__actions { display: flex; gap: 8px; margin-top: 2px; }
.card__estadoSelect {
    flex: 1;
    height: 38px;
    padding: 0 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #fff;
    font: inherit;
    cursor: pointer;
}
.card__notasBtn {
    height: 38px;
    padding: 0 14px;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 8px;
    font: inherit;
    font-weight: 600;
    color: var(--text);
    cursor: pointer;
}
.card__notasBtn:hover { background: #f1f5f9; }
.card__notasBtn[aria-pressed="true"] {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
}

.card__notas {
    width: 100%;
    min-height: 70px;
    padding: 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font: inherit;
    resize: vertical;
    margin-top: 4px;
}
.card__notas:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(15, 118, 110, .15);
}

.card__fuente { color: var(--muted); font-size: 11px; margin-top: 2px; }

.bottombar { text-align: center; color: var(--muted); padding: 20px 18px 30px; font-size: 12px; }
.bottombar b { color: var(--text); }

.empty {
    grid-column: 1 / -1;
    text-align: center;
    color: var(--muted);
    padding: 60px 20px;
    font-size: 15px;
}

@media (max-width: 600px) {
    .topbar { padding: 12px 14px; }
    .topbar h1 { font-size: 16px; }
    .toolbar { padding: 10px 14px; top: 70px; }
    .grid { padding: 14px; gap: 12px; grid-template-columns: 1fr; }
    .card { padding: 14px; }
    .card__name { font-size: 15px; }
}

</style>
</head>

    <header class="topbar">
        <div class="topbar__brand">
            <h1>CRM Dentistas RD</h1>
            <span class="topbar__tagline">Prospección · Web design para clínicas del Cibao</span>
        </div>
        <div class="topbar__stats">
            <span class="stat" id="statTotal">0 prospectos</span>
            <span class="stat stat--ok" id="statGanados">0 ganados</span>
            <span class="stat stat--info" id="statActivos">0 en proceso</span>
            <span class="stat stat--hot" id="statAlto">0 🔥 alto</span>
        </div>
    </header>

    <section class="toolbar">
        <input
            type="search"
            id="search"
            class="toolbar__search"
            placeholder="Buscar por nombre, teléfono, dirección, web..."
            autocomplete="off">
        <select id="filterProvincia" class="toolbar__select"></select>
        <select id="filterEstado" class="toolbar__select">
            <option value="">Todos los estados</option>
            <option value="prospecto">Prospecto</option>
            <option value="auditado">Auditado</option>
            <option value="contactado">Contactado</option>
            <option value="cita_agendada">Cita agendada</option>
            <option value="propuesta_enviada">Propuesta enviada</option>
            <option value="cerrado_ganado">Cliente ganado</option>
            <option value="cerrado_perdido">Cerrado perdido</option>
        </select>
        <select id="filterScore" class="toolbar__select">
            <option value="">Todo lead score</option>
            <option value="alto">🔥 Alto</option>
            <option value="medio">Medio</option>
            <option value="bajo">Bajo</option>
        </select>
        <select id="filterWeb" class="toolbar__select">
            <option value="">Cualquier web</option>
            <option value="sin_web">🚫 Sin web</option>
            <option value="con_web">🌐 Con web</option>
            <option value="obsoleta">⚠️ Web obsoleta</option>
        </select>
        <button id="btnExport" class="toolbar__btn">CSV</button>
        <button id="btnReset" class="toolbar__btn toolbar__btn--danger">Reset</button>
    </section>

    <main id="grid" class="grid"></main>

    <template id="cardTemplate">
        <article class="card" data-id="" data-estado="" data-score="">
            <header class="card__head">
                <div class="card__head-left">
                    <h2 class="card__name"></h2>
                    <span class="card__score"></span>
                </div>
                <span class="card__estado"></span>
            </header>
            <p class="card__direccion"></p>
            <p class="card__meta">
                <span class="card__provincia"></span>
                <span class="card__especialidad"></span>
            </p>
            <div class="card__contacto"></div>
            <div class="card__actions">
                <select class="card__estadoSelect"></select>
                <button class="card__notasBtn">Notas</button>
            </div>
            <textarea class="card__notas" placeholder="Notas: con quién hablé, qué dijo, próximo paso..." hidden></textarea>
            <small class="card__fuente"></small>
        </article>
    </template>

    <footer class="bottombar">
        <small>
            Pipeline: <b>Prospecto</b> → <b>Auditado</b> (PageSpeed enviado) → <b>Contactado</b> → <b>Cita</b> → <b>Propuesta</b> → <b>Ganado/Perdido</b>.
            Tu progreso se guarda solo en tu navegador.
        </small>
    </footer>

<script>
// CRM Dentistas RD - logica cliente
// Estado por contacto (estado + notas) en localStorage bajo "crm_dentistas_state_v2".
// v2: pipeline de ventas (prospecto -> cerrado_ganado/perdido) en vez de estados de llamada.

const STORAGE_KEY = "crm_dentistas_state_v2";

const ESTADOS = [
    "prospecto",
    "auditado",
    "contactado",
    "cita_agendada",
    "propuesta_enviada",
    "cerrado_ganado",
    "cerrado_perdido",
];
const ESTADO_LABEL = {
    prospecto:         "Prospecto",
    auditado:          "Auditado",
    contactado:        "Contactado",
    cita_agendada:     "Cita agendada",
    propuesta_enviada: "Propuesta enviada",
    cerrado_ganado:    "Cliente ganado",
    cerrado_perdido:   "Cerrado perdido",
};
const SCORE_LABEL = { alto: "🔥 Alto", medio: "Medio", bajo: "Bajo" };

const state = {
    dentistas: [],
    progreso: {},
    filtros: { texto: "", provincia: "", estado: "", score: "", web: "" },
};

const els = {
    grid: document.getElementById("grid"),
    search: document.getElementById("search"),
    filterProvincia: document.getElementById("filterProvincia"),
    filterEstado: document.getElementById("filterEstado"),
    filterScore: document.getElementById("filterScore"),
    filterWeb: document.getElementById("filterWeb"),
    btnExport: document.getElementById("btnExport"),
    btnReset: document.getElementById("btnReset"),
    statTotal: document.getElementById("statTotal"),
    statGanados: document.getElementById("statGanados"),
    statActivos: document.getElementById("statActivos"),
    statAlto: document.getElementById("statAlto"),
    template: document.getElementById("cardTemplate"),
};

// ---------------------------------------------------------------------------
// Persistencia
// ---------------------------------------------------------------------------
function loadProgress() {
    try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : {};
    } catch (err) {
        console.warn("No se pudo leer el progreso:", err);
        return {};
    }
}

function saveProgress() {
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state.progreso));
    } catch (err) {
        console.warn("No se pudo guardar el progreso:", err);
    }
}

function getProgreso(id) {
    if (!state.progreso[id]) {
        state.progreso[id] = { estado: "prospecto", notas: "", updated: null };
    }
    return state.progreso[id];
}

// ---------------------------------------------------------------------------
// Dataset
// ---------------------------------------------------------------------------
async function loadDataset() {
    state.dentistas = window.__DENTISTS_DATA__.dentistas || [];
}

// ---------------------------------------------------------------------------
// Filtros
// ---------------------------------------------------------------------------
function normalize(text) {
    return (text || "")
        .toString()
        .toLowerCase()
        .normalize("NFD")
        .replace(/[̀-ͯ]/g, "");
}

function applyFilters() {
    const q = normalize(state.filtros.texto.trim());
    const { provincia, estado, score, web } = state.filtros;
    return state.dentistas.filter((d) => {
        if (provincia && d.provincia !== provincia) return false;
        if (score && d.lead_score !== score) return false;
        if (web === "con_web" && !d.web) return false;
        if (web === "sin_web" &&  d.web) return false;
        if (web === "obsoleta" && !["wordpress_gratis", "basica"].includes(d.web_calidad)) return false;
        if (estado) {
            const est = getProgreso(d.id).estado;
            if (est !== estado) return false;
        }
        if (!q) return true;
        const haystack = normalize(
            [d.nombre, d.telefono, d.telefono_alt, d.direccion, d.ciudad, d.provincia, d.especialidad, d.web].join(" ")
        );
        return haystack.includes(q);
    });
}

// ---------------------------------------------------------------------------
// Helpers de links externos
// ---------------------------------------------------------------------------
function telLink(phone) {
    const clean = phone.replace(/[^\d+]/g, "");
    return "tel:+1" + clean.replace(/^1/, "");
}
function waLink(phone) {
    const clean = phone.replace(/\D/g, "");
    const n = clean.length === 11 && clean.startsWith("1") ? clean : "1" + clean;
    return "https://wa.me/" + n;
}
function googleSearchLink(d) {
    const q = encodeURIComponent(`"${d.nombre}" ${d.ciudad || d.provincia} dentista`);
    return "https://www.google.com/search?q=" + q;
}
function googleMapsLink(d) {
    const q = encodeURIComponent(`${d.nombre} ${d.ciudad || ""} ${d.provincia || ""} Republica Dominicana`);
    return "https://www.google.com/maps/search/" + q;
}
function instagramSearchLink(d) {
    const q = encodeURIComponent(d.nombre);
    return "https://www.google.com/search?q=site%3Ainstagram.com+" + q;
}
function pageSpeedLink(url) {
    return "https://pagespeed.web.dev/analysis?url=" + encodeURIComponent(url);
}

// ---------------------------------------------------------------------------
// Render
// ---------------------------------------------------------------------------
function renderProvincias() {
    const provincias = Array.from(
        new Set(state.dentistas.map((d) => d.provincia).filter(Boolean))
    ).sort();
    els.filterProvincia.innerHTML =
        '<option value="">Todas las provincias</option>' +
        provincias.map((p) => `<option value="${p}">${p}</option>`).join("");
}

function renderPhoneRow(d, phone, isAlt) {
    if (!phone || phone === "verificar") {
        return `
            <div class="phone-row phone-row--missing">
                <span class="phone-row__label">Sin teléfono</span>
                <a class="btn btn--mini" href="${googleSearchLink(d)}" target="_blank" rel="noopener">🔍 Buscar</a>
                <a class="btn btn--mini" href="${googleMapsLink(d)}" target="_blank" rel="noopener">📍 Maps</a>
                <a class="btn btn--mini" href="${instagramSearchLink(d)}" target="_blank" rel="noopener">📷 IG</a>
            </div>`;
    }
    return `
        <div class="phone-row">
            <a class="phone-link${isAlt ? " phone-link--alt" : ""}" href="${telLink(phone)}">📞 ${phone}</a>
            <a class="btn btn--wa" href="${waLink(phone)}" target="_blank" rel="noopener" title="Abrir WhatsApp">WA</a>
        </div>`;
}

function renderWebRow(d) {
    if (d.web) {
        const obsoleta = ["wordpress_gratis", "basica"].includes(d.web_calidad);
        const tag = d.web_calidad === "wordpress_gratis" ? "WordPress gratis — pitch fácil"
                  : d.web_calidad === "basica"           ? "Web básica — rediseño"
                  : d.web_calidad === "institucional"    ? "Institucional"
                  : "Web moderna";
        return `
            <div class="web-row">
                <a class="btn btn--web" href="${d.web}" target="_blank" rel="noopener">🌐 ${new URL(d.web).hostname}</a>
                <a class="btn btn--audit" href="${pageSpeedLink(d.web)}" target="_blank" rel="noopener" title="Auditar con PageSpeed Insights">⚡ Auditar</a>
                <span class="web-tag ${obsoleta ? "web-tag--opp" : ""}">${tag}</span>
            </div>`;
    }
    return `
        <div class="web-row web-row--missing">
            <span class="no-web">🚫 Sin web — oportunidad</span>
            <a class="btn btn--mini" href="${googleSearchLink(d)}" target="_blank" rel="noopener">Verificar</a>
        </div>`;
}

function renderCard(d) {
    const node = els.template.content.firstElementChild.cloneNode(true);
    const progreso = getProgreso(d.id);

    node.dataset.id = d.id;
    node.dataset.estado = progreso.estado;
    node.dataset.score = d.lead_score;

    node.querySelector(".card__name").textContent = d.nombre;
    node.querySelector(".card__direccion").textContent = d.direccion || "(sin dirección)";
    node.querySelector(".card__provincia").textContent =
        [d.ciudad, d.provincia].filter(Boolean).join(" · ") || "Sin provincia";
    node.querySelector(".card__especialidad").textContent = d.especialidad || "";
    node.querySelector(".card__estado").textContent = ESTADO_LABEL[progreso.estado];
    node.querySelector(".card__score").textContent = SCORE_LABEL[d.lead_score] || "";
    node.querySelector(".card__fuente").textContent = d.fuente ? `Fuente: ${d.fuente}` : "";

    const contacto = node.querySelector(".card__contacto");
    contacto.insertAdjacentHTML("beforeend", renderPhoneRow(d, d.telefono, false));
    if (d.telefono_alt) {
        contacto.insertAdjacentHTML("beforeend", renderPhoneRow(d, d.telefono_alt, true));
    }
    contacto.insertAdjacentHTML("beforeend", renderWebRow(d));

    const estadoSelect = node.querySelector(".card__estadoSelect");
    estadoSelect.innerHTML = ESTADOS.map(
        (e) => `<option value="${e}">${ESTADO_LABEL[e]}</option>`
    ).join("");
    estadoSelect.value = progreso.estado;
    estadoSelect.addEventListener("change", (e) => {
        const p = getProgreso(d.id);
        p.estado = e.target.value;
        p.updated = new Date().toISOString();
        saveProgress();
        node.dataset.estado = p.estado;
        node.querySelector(".card__estado").textContent = ESTADO_LABEL[p.estado];
        updateStats();
        if (state.filtros.estado && state.filtros.estado !== p.estado) node.remove();
    });

    const notasArea = node.querySelector(".card__notas");
    notasArea.value = progreso.notas || "";
    const notasBtn = node.querySelector(".card__notasBtn");
    if (progreso.notas) {
        notasBtn.setAttribute("aria-pressed", "true");
        notasBtn.textContent = "Notas ●";
    }
    notasBtn.addEventListener("click", () => {
        const open = !notasArea.hidden;
        notasArea.hidden = open;
        notasBtn.setAttribute("aria-pressed", open ? "false" : "true");
        if (!open) notasArea.focus();
    });
    let saveTimeout;
    notasArea.addEventListener("input", (e) => {
        clearTimeout(saveTimeout);
        saveTimeout = setTimeout(() => {
            const p = getProgreso(d.id);
            p.notas = e.target.value;
            p.updated = new Date().toISOString();
            saveProgress();
            notasBtn.textContent = p.notas ? "Notas ●" : "Notas";
        }, 300);
    });

    return node;
}

function render() {
    const filtered = applyFilters();
    els.grid.innerHTML = "";
    if (!filtered.length) {
        els.grid.innerHTML = '<div class="empty">No hay prospectos que coincidan con los filtros.</div>';
    } else {
        // Ordena por lead_score (alto primero) para que veas los mejores primero
        filtered.sort((a, b) => {
            const order = { alto: 0, medio: 1, bajo: 2 };
            return (order[a.lead_score] ?? 9) - (order[b.lead_score] ?? 9);
        });
        const frag = document.createDocumentFragment();
        filtered.forEach((d) => frag.appendChild(renderCard(d)));
        els.grid.appendChild(frag);
    }
    updateStats();
}

function updateStats() {
    const total = state.dentistas.length;
    let ganados = 0, activos = 0, alto = 0;
    state.dentistas.forEach((d) => {
        const est = getProgreso(d.id).estado;
        if (est === "cerrado_ganado") ganados++;
        if (["contactado", "cita_agendada", "propuesta_enviada", "auditado"].includes(est)) activos++;
        if (d.lead_score === "alto" && est !== "cerrado_perdido" && est !== "cerrado_ganado") alto++;
    });
    els.statTotal.textContent = `${total} prospectos`;
    els.statGanados.textContent = `${ganados} ganados`;
    els.statActivos.textContent = `${activos} en proceso`;
    els.statAlto.textContent = `${alto} 🔥 alto`;
}

// ---------------------------------------------------------------------------
// Export CSV
// ---------------------------------------------------------------------------
function exportCSV() {
    const headers = [
        "id","nombre","telefono","telefono_alt","whatsapp",
        "direccion","ciudad","provincia","especialidad",
        "web","web_calidad","lead_score",
        "estado","notas","fuente",
    ];
    const rows = state.dentistas.map((d) => {
        const p = getProgreso(d.id);
        const tel = d.telefono && d.telefono !== "verificar" ? d.telefono : "";
        const wa  = tel ? waLink(tel) : "";
        return headers.map((h) => {
            const val =
                h === "estado"   ? ESTADO_LABEL[p.estado] :
                h === "notas"    ? (p.notas || "") :
                h === "whatsapp" ? wa :
                (d[h] || "");
            return `"${String(val).replace(/"/g, '""')}"`;
        }).join(",");
    });
    const csv = [headers.join(","), ...rows].join("\n");
    const blob = new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `crm-dentistas-${new Date().toISOString().slice(0,10)}.csv`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
}

// ---------------------------------------------------------------------------
// Eventos
// ---------------------------------------------------------------------------
function wireEvents() {
    let t;
    els.search.addEventListener("input", (e) => {
        clearTimeout(t);
        t = setTimeout(() => { state.filtros.texto = e.target.value; render(); }, 150);
    });
    els.filterProvincia.addEventListener("change", (e) => { state.filtros.provincia = e.target.value; render(); });
    els.filterEstado.addEventListener("change",    (e) => { state.filtros.estado    = e.target.value; render(); });
    els.filterScore.addEventListener("change",     (e) => { state.filtros.score     = e.target.value; render(); });
    els.filterWeb.addEventListener("change",       (e) => { state.filtros.web       = e.target.value; render(); });
    els.btnExport.addEventListener("click", exportCSV);
    els.btnReset.addEventListener("click", () => {
        if (confirm("Borrar todos los estados y notas guardados?")) {
            state.progreso = {};
            localStorage.removeItem(STORAGE_KEY);
            render();
        }
    });
}

// ---------------------------------------------------------------------------
// Init
// ---------------------------------------------------------------------------
(async function init() {
    try {
        state.progreso = loadProgress();
        await loadDataset();
        renderProvincias();
        wireEvents();
        render();
    } catch (err) {
        console.error(err);
        els.grid.innerHTML = `<div class="empty">Error cargando datos: ${err.message}</div>`;
    }
})();

</script>
